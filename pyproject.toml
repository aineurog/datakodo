[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datakodo"
version = "0.1.0"
description = "Unified market data library — one interface, many providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Qaisar Jalil" },
]
keywords = [
    "market-data",
    "ohlcv",
    "trading",
    "crypto",
    "equities",
    "forex",
    "binance",
    "resampling",
    "batch-fetch",
    "fundamentals",
    "websocket",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
binance = [
    "python-binance>=1.0",
]
alpaca = [
    "alpaca-py>=0.20",
]
polygon = [
    "polygon-api-client>=1.0",
]
mt5 = [
    "MetaTrader5",
]
ibkr = [
    "ib-insync>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]
all = [
    "python-binance>=1.0",
    "alpaca-py>=0.20",
    "polygon-api-client>=1.0",
    "MetaTrader5; sys_platform == 'win32'",
    "ib-insync>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "MetaTrader5",
    "ib_insync.*",
    "binance.*",
    "python_binance.*",
    "alpaca.*",
    "polygon.*",
    "numpy",
    "pandas",
    "pyarrow",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
